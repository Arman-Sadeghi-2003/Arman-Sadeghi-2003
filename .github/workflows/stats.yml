name: Update stats card
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/stats.py
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_USER: Arman-Sadeghi-2003
      - run: python .github/extras.py
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_USER: Arman-Sadeghi-2003
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/*.svg
          git diff --staged --quiet || (git commit -m "Update profile cards" && git push)
